<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Social links profile</title>

</head>
<body>
  <main class="profile-card">
    <img class="profile-picture" src="./assets/images/avatar-jessica.jpeg" alt="Jessica Randall profile picture">
    <div class="header-group">
      <h1 class="text-preset-1">Jessica Randall</h1>
      <p class="text-preset-2-bold">London, United Kingdom</p>
    </div>
    
    <p class="profile-tagline text-preset-2">"Front-end developer and avid reader."</p>
    
    <div class="link-group">
        <a href="#" class="text-preset-2-bold">GitHub</a>
        <a href="#" class="text-preset-2-bold">Frontend Mentor</a>
        <a href="#" class="text-preset-2-bold">LinkedIn</a>
        <a href="#" class="text-preset-2-bold">Twitter</a>
        <a href="#" class="text-preset-2-bold">Instagram</a>
    </div>
  </main>
  

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://www.emilyhuang.io/" target="_blank" rel="noopener noreferrer">Emily Huang</a>.
  </footer>
</body>
</html>
